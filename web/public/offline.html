<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReactionLab — offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f7f6f3;
        --ink: #16181d;
        --muted: #5f6672;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #101114;
          --ink: #eceef2;
          --muted: #99a1af;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--paper);
        color: var(--ink);
        font-family: Manrope, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        max-width: 28rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ReactionLab isn't cached yet</h1>
      <p>
        Open the app once while online and it will work offline from then on. Your scores never
        leave this device.
      </p>
    </main>
  </body>
</html>
