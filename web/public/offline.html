<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReactionLab — offline</title>
    <style>
      /* Standalone fallback with no stylesheet, so the brand values are
         written inline via light-dark() rather than redefining the
         platform's tokens. */
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: light-dark(#f7f6f3, #101114);
        color: light-dark(#16181d, #eceef2);
        font-family: Manrope, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      h1 {
        font-family: Fraunces, ui-serif, Georgia, serif;
        font-size: 1.35rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        color: light-dark(#5f6672, #98a0ae);
        max-width: 28rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ReactionLab isn't cached yet</h1>
      <p>
        Open the app once while online and it will work offline from then on. Your scores never
        leave this device.
      </p>
    </main>
  </body>
</html>
